apiVersion: v1
kind: Namespace
metadata:
  name: samsam
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: samsam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: samsam-web
  template:
    metadata:
      labels:
        app: samsam-web
    spec:
      containers:
        - name: web
          image: samsam/web:2.5.9
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: samsam
spec:
  type: NodePort
  selector:
    app: samsam-web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 31083
