server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.wikimedia.org https://*.wikipedia.org; connect-src 'self' https://ko.wikipedia.org; frame-src 'none'; object-src 'none'; base-uri 'none'" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
